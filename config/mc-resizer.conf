# Geometry is fixed for speed. Values are in X screen coordinates.
monitor_x=1920
monitor_y=0
monitor_w=2560
monitor_h=1440

thin_w=2560
thin_h=267

wide_w=600
wide_h=1440

# ewmh asks the window manager to move/resize the client window.
# frame-direct directly moves the window-manager frame and is faster but less portable.
backend=frame-direct

# Some OpenGL/GLFW windows resize geometrically but do not repaint their viewport
# cleanly after extreme aspect-ratio changes. focus-bounce briefly activates
# another normal top-level window, then activates the target again. It sends no
# keyboard or mouse input.
# Values: none, expose, focus-bounce
refresh=focus-bounce
refresh_delay_ms=35
settle_timeout_ms=80

# Empty socket_path means:
#   $XDG_RUNTIME_DIR/mc-resizer.sock
# or /tmp/mc-resizer-$UID.sock if XDG_RUNTIME_DIR is not set.
socket_path=

# Hotkeys use X11 modifier names plus a keysym, separated by '+'.
# Examples: Ctrl+Alt+1, Super+F8, Shift+Mod4+t
key_thin=Ctrl+Alt+1
key_wide=Ctrl+Alt+2
key_full=Ctrl+Alt+3
key_cycle=Ctrl+Alt+4

# Matching is intentionally narrow enough to avoid most non-target Java windows.
title_match=Minecraft,MCSR
class_match=Minecraft,GLFW,java

# Measurement hotkeys and related
key_measurement_screen_toggle=grave+Tab
measurement_center_screen=0.3    # It means it'll bring the center 30 percents to full screen